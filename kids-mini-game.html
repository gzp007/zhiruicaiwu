<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07090e">
<title>游戏大厅</title>
<style>
:root{
  --bg:#07090e;
  --text:#e8edf7;
  --muted:#8b95aa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;min-height:100dvh;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 560px at 12% -12%, rgba(110,231,255,.15), transparent 62%),
    radial-gradient(900px 520px at 105% 112%, rgba(167,84,255,.16), transparent 60%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:22px 16px;
  overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 72%);
  mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 72%);
}
#home{
  width:min(580px, 92vw, 64vh);
  text-align:center;
  transition:opacity .3s ease, transform .3s ease;
}
#home.is-hidden{opacity:0;transform:scale(.94);pointer-events:none;position:absolute}
h1{
  margin:0;
  font-size:clamp(26px, 5vw, 38px);
  font-weight:800;
  letter-spacing:3px;
}
h1 span{
  background:linear-gradient(90deg,#6ee7ff,#a855f7);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.sub{margin:9px 0 0;font-size:13px;color:var(--muted);letter-spacing:1px}
#grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  margin-top:22px;
}
.tile{
  position:relative;
  aspect-ratio:1/1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  color:var(--text);
  font-family:inherit;
  cursor:pointer;
  overflow:hidden;
  transition:transform .18s ease, box-shadow .25s ease, border-color .25s ease;
  animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;
}
.tile::before{
  content:"";position:absolute;inset:0;opacity:0;
  transition:opacity .25s ease;
  background:radial-gradient(circle at 50% 0%, var(--c, rgba(110,231,255,.5)), transparent 68%);
}
.tile:hover{
  transform:translateY(-5px);
  border-color:var(--c);
  box-shadow:0 14px 34px -12px var(--c), 0 0 0 1px var(--c) inset;
}
.tile:hover::before{opacity:.22}
.tile:active{transform:scale(.97)}
.ico{
  font-size:clamp(24px, 4.6vh, 34px);
  line-height:1;
  filter:drop-shadow(0 0 10px var(--c));
}
.nm{font-size:clamp(14px, 2.1vh, 17px);font-weight:700;letter-spacing:1px}
.ds{font-size:11px;color:var(--muted)}
.tile.empty{
  cursor:default;
  border-style:dashed;
  border-color:rgba(255,255,255,.08);
  background:rgba(255,255,255,.015);
  animation-delay:0ms !important;
}
.tile.empty .plus{font-size:22px;line-height:1;color:rgba(255,255,255,.16)}
.tile.empty .ds{color:rgba(255,255,255,.2)}
.foot{margin:16px 0 0;font-size:11px;color:rgba(255,255,255,.28);letter-spacing:.5px}
@keyframes rise{
  from{opacity:0;transform:translateY(14px) scale(.96)}
  to{opacity:1;transform:none}
}
#stage{position:fixed;inset:0;display:none;background:#0b0d12;z-index:50}
#stage.is-shown{display:block}
#gameFrame{display:block;width:100%;height:100%;border:0;background:#f4f4f4}
#back{
  position:fixed;
  z-index:60;
  top:calc(10px + env(safe-area-inset-top));
  left:calc(10px + env(safe-area-inset-left));
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  background:rgba(13,16,24,.78);
  color:var(--text);
  font-family:inherit;
  font-size:13px;
  cursor:pointer;
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:background .2s ease, transform .15s ease;
}
#back:hover{background:rgba(35,42,60,.9)}
#back:active{transform:scale(.96)}
</style>
</head>
<body>

<div id="home">
  <header>
    <h1>游戏<span>大厅</span></h1>
    <p class="sub">四个经典小游戏 · 点击图标开始</p>
  </header>
  <div id="grid"></div>
  <p class="foot">单文件离线版 · 左上角可返回大厅</p>
</div>

<div id="stage">
  <button id="back" type="button">← 返回大厅</button>
  <iframe id="gameFrame" title="游戏窗口"></iframe>
</div>

<script type="text/plain" id="src-gomoku"><!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>五子棋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;background:#f4f4f4;gap:10px;padding:10px;
  overflow:hidden;
}
#tip{font-size:17px;height:26px;text-align:center;color:#222;}
#board{
  width:340px;height:340px;position:relative;background:#deb887;
}
.cell{
  position:absolute;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:2;
}
.line{
  position:absolute;
  background:#333;
  z-index:1;
}
.win-line{
  position:absolute;
  background:#2e7d32;
  height:6px;
  transform-origin: left center;
  z-index:3;
  border-radius:3px;
}
.ctrl-bar{
  display:flex;gap:8px;align-items:center;
  flex-wrap:wrap;justify-content:center;
}
select,button{
  padding:7px 10px;font-size:14px;
}
#restart{
  padding:8px 16px;border:none;background:#222;color:#fff;border-radius:6px;cursor:pointer;
}
#confetti{
  position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;
}
.confetti-item{
  position:absolute;
  width:10px;height:10px;
  border-radius:50%;
  animation: fall 3s linear forwards;
}
@keyframes fall {
  0%{transform:translateY(-10px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}
</style>
</head>
<body>
<div class="ctrl-bar">
  <label>模式：
    <select id="gameMode">
      <option value="pvp">双人同机</option>
      <option value="ai">人机对战</option>
    </select>
  </label>
  <label>AI智力：
    <select id="aiLevel">
      <option value="easy">简单</option>
      <option value="mid" selected>中等</option>
      <option value="hard">困难</option>
    </select>
  </label>
  <label>AI速度：
    <select id="aiSpeed">
      <option value="200">快</option>
      <option value="600" selected>中</option>
      <option value="1200">慢</option>
    </select>
  </label>
  <button id="restart">重开</button>
</div>
<div id="tip">五子棋｜黑棋先行，连成五子获胜</div>
<div id="board"></div>
<div id="confetti"></div>

<script>
const boardEl = document.getElementById('board')
const tipEl = document.getElementById('tip')
const restartBtn = document.getElementById('restart')
const modeSel = document.getElementById('gameMode')
const levelSel = document.getElementById('aiLevel')
const speedSel = document.getElementById('aiSpeed')
const confettiEl = document.getElementById('confetti')

const size = 15
const gap = 340 / size
const center = 7
let board = []
let turn = 1 //1黑 2白
let gameOver = false
let winPoints = null

const dirs = [[1,0],[0,1],[1,1],[1,-1]]

function showConfetti(){
  const colors = ['#ff4444','#44ff44','#4444ff','#ffdd00','#ff44ff']
  for(let i=0;i<80;i++){
    const div = document.createElement('div')
    div.className = 'confetti-item'
    div.style.left = Math.random()*100 + '%'
    div.style.background = colors[Math.floor(Math.random()*colors.length)]
    div.style.animationDelay = Math.random()*0.8 + 's'
    confettiEl.appendChild(div)
    setTimeout(()=>div.remove(),3000)
  }
}

function drawGrid(){
  boardEl.innerHTML=''
  winPoints=null
  for(let i=0;i<size;i++){
    const h = document.createElement('div')
    h.className='line'
    h.style.width='100%'
    h.style.height='1px'
    h.style.top=(i*gap)+'px'
    boardEl.appendChild(h)
    const v = document.createElement('div')
    v.className='line'
    v.style.width='1px'
    v.style.height='100%'
    v.style.left=(i*gap)+'px'
    boardEl.appendChild(v)
  }
}

function drawWinLine(points){
  const [p1,p2] = points
  const x1 = p1[0] * gap
  const y1 = p1[1] * gap
  const x2 = p2[0] * gap
  const y2 = p2[1] * gap
  const dx = x2 - x1
  const dy = y2 - y1
  const len = Math.sqrt(dx*dx + dy*dy)
  const angle = Math.atan2(dy, dx) * 180 / Math.PI

  const line = document.createElement('div')
  line.className='win-line'
  line.style.left = x1 + 'px'
  line.style.top = y1 + 'px'
  line.style.width = len + 'px'
  line.style.transform = `rotate(${angle}deg)`
  boardEl.appendChild(line)
}

function init(){
  gameOver=false
  turn=1
  board = Array(size).fill().map(()=>Array(size).fill(0))
  drawGrid()
  tipEl.innerText = modeSel.value==='pvp' ? '五子棋｜黑棋先行，连成五子获胜' : '五子棋｜人机模式，你是黑棋'
}

function getPos(e){
  const rect = boardEl.getBoundingClientRect()
  let x = e.clientX - rect.left
  let y = e.clientY - rect.top
  let cx = Math.round(x/gap)
  let cy = Math.round(y/gap)
  if(cx<0||cx>=size||cy<0||cy>=size) return null
  return [cx,cy]
}

boardEl.onclick = function(e){
  if(gameOver) return
  if(modeSel.value==='ai' && turn===2) return
  const p = getPos(e)
  if(!p) return
  const [x,y] = p
  if(board[y][x]!==0) return

  board[y][x] = turn
  renderStone(x,y,turn)
  const winRes = checkWin(x,y,turn)
  if(winRes){
    gameOver=true
    winPoints = winRes
    drawWinLine(winRes)
    tipEl.innerText = turn===1 ? '🎉 黑棋获胜！' : '🎉 白棋获胜！'
    showConfetti()
    return
  }
  if(isFull()){
    gameOver=true
    tipEl.innerText='🤝 平局！'
    return
  }
  turn = turn===1?2:1
  if(modeSel.value==='ai' && turn===2){
    tipEl.innerText='AI思考中...'
    setTimeout(aiPlay, Number(speedSel.value))
  }
}

function renderStone(x,y,t){
  const div = document.createElement('div')
  div.className='cell'
  div.style.width = (gap*0.8)+'px'
  div.style.height = (gap*0.8)+'px'
  div.style.left = (x*gap)+'px'
  div.style.top = (y*gap)+'px'
  div.style.background = t===1 ? '#000' : '#fff'
  div.style.border = t===2 ? '1px solid #999' : ''
  boardEl.appendChild(div)
}

function checkWin(x,y,t){
  for(let [dx,dy] of dirs){
    let cnt=1
    let sx=x, sy=y
    let start = [x,y]
    while(true){
      sx+=dx;sy+=dy
      if(sx<0||sx>=size||sy<0||sy>=size||board[sy][sx]!==t) break
      cnt++
      start = [sx,sy]
    }
    sx=x; sy=y
    let end = [x,y]
    while(true){
      sx-=dx;sy-=dy
      if(sx<0||sx>=size||sy<0||sy>=size||board[sy][sx]!==t) break
      cnt++
      end = [sx,sy]
    }
    if(cnt>=5){
      return [start, end]
    }
  }
  return false
}

function isFull(){
  for(let r of board) if(r.includes(0)) return false
  return true
}

// 新逻辑：落在(x,y)之后，检查四个方向能不能凑5
function scorePoint(x,y,me){
  const op = me===1?2:1
  let s=0
  // 中心点加分
  const dist = Math.max(Math.abs(x-center), Math.abs(y-center))
  s += (14 - dist) * 8

  // 模拟落子
  board[y][x] = me
  for(let [dx,dy] of dirs){
    let my = 1
    let sx=x+dx,sy=y+dy
    while(sx>=0&&sx<size&&sy>=0&&sy<size&&board[sy][sx]===me){my++;sx+=dx;sy+=dy}
    sx=x-dx;sy=y-dy
    while(sx>=0&&sx<size&&sy>=0&&sy<size&&board[sy][sx]===me){my++;sx-=dx;sy-=dy}
    if(my>=5) s += 200000 //直接成五，最高分
    else if(my===4) s += 100000
    else if(my===3) s += 12000
    else if(my===2) s += 1000
  }
  // 撤销模拟落子
  board[y][x] = 0

  // 模拟放对手棋子，检查防守价值
  board[y][x] = op
  for(let [dx,dy] of dirs){
    let yo = 1
    let sx=x+dx,sy=y+dy
    while(sx>=0&&sx<size&&sy>=0&&sy<size&&board[sy][sx]===op){yo++;sx+=dx;sy+=dy}
    sx=x-dx;sy=y-dy
    while(sx>=0&&sx<size&&sy>=0&&sy<size&&board[sy][sx]===op){yo++;sx-=dx;sy-=dy}
    if(yo>=5) s += 220000 //对手成五，堵点优先级最高
    else if(yo===4) s += 150000 //对手四连，必须堵！
    else if(yo===3) s += 11000
    else if(yo===2) s += 900
  }
  board[y][x] = 0
  return s
}

function aiPlay(){
  const level = levelSel.value
  let bestX=0,bestY=0
  let max=-999999
  let candidate = []

  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      if(board[y][x]!==0) continue
      let hasNear = false
      for(let dy=-2;dy<=2;dy++){
        for(let dx=-2;dx<=2;dx++){
          let nx=x+dx, ny=y+dy
          if(nx>=0&&nx<size&&ny>=0&&ny<size&&board[ny][nx]!==0){
            hasNear=true
            break
          }
        }
        if(hasNear) break
      }
      if(hasNear) candidate.push([x,y])
    }
  }
  if(candidate.length===0){
    candidate.push([center,center])
  }

  if(level==='easy'){
    for(let [x,y] of candidate){
      const s = scorePoint(x,y,2)
      if(s>max){max=s;bestX=x;bestY=y}
    }
    if(Math.random()<0.2){
      const r = candidate[Math.floor(Math.random()*candidate.length)]
      bestX=r[0];bestY=r[1]
    }
  }else{
    for(let [x,y] of candidate){
      const s = scorePoint(x,y,2)
      if(s>max){max=s;bestX=x;bestY=y}
    }
  }

  board[bestY][bestX] = 2
  renderStone(bestX,bestY,2)
  const winRes = checkWin(bestX,bestY,2)
  if(winRes){
    gameOver=true
    winPoints = winRes
    drawWinLine(winRes)
    tipEl.innerText='🎉 AI白棋获胜！'
    showConfetti()
    return
  }
  if(isFull()){
    gameOver=true
    tipEl.innerText='🤝 平局！'
    return
  }
  turn=1
  tipEl.innerText='轮到黑棋'
}

restartBtn.onclick = init
modeSel.onchange = init
levelSel.onchange = init
init()
<\/script>
</body>
</html>
</script>

<script>

const tipEl = document.getElementById('tip')
const restartBtn = document.getElementById('restart')

const speedSel = document.getElementById('aiSpeed')
const confettiEl = document.getElementById('confetti')

let board = []
let turn = 'X'
let gameOver = false

const winLines = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
]

function showConfetti(){
  const colors = ['#ff4444','#44ff44','#4444ff','#ffdd00','#ff44ff']
  for(let i=0;i<80;i++){
    const div = document.createElement('div')
    div.className = 'confetti-item'
    div.style.left = Math.random()*100 + '%'
    div.style.background = colors[Math.floor(Math.random()*colors.length)]
    div.style.animationDelay = Math.random()*0.8 + 's'
    confettiEl.appendChild(div)
    setTimeout(()=>div.remove(),3000)
  }
}

function drawBoard(){
  boardEl.innerHTML = ''
  for(let i=0;i<9;i++){
    const div = document.createElement('div')
    div.className='cell'
    div.dataset.idx=i
    div.onclick = ()=>click(i)
    boardEl.appendChild(div)
  }
}

function init(){
  gameOver=false
  turn='X'
  board = Array(9).fill(null)
  drawBoard()
  tipEl.innerText = modeSel.value==='pvp' ? '井字棋｜X先行，连成一线获胜' : '井字棋｜人机模式，你是X'
}

function click(idx){
  if(gameOver) return
  if(modeSel.value==='ai' && turn==='O') return
  if(board[idx]) return

  board[idx] = turn
  render()

  const winLine = getWinLine(turn)
  if(winLine){
    gameOver=true
    markWinLine(winLine)
    tipEl.innerText = `🎉 ${turn}获胜！`
    showConfetti()
    return
  }
  if(board.every(x=>x)){
    gameOver=true
    tipEl.innerText='🤝 平局，握手言和！'
    return
  }
  turn = turn==='X'?'O':'X'
  if(modeSel.value==='ai' && turn==='O'){
    tipEl.innerText='AI思考中...'
    setTimeout(aiPlay, Number(speedSel.value))
  }else{
    tipEl.innerText=`轮到${turn}`
  }
}

function render(){
  const cells = document.querySelectorAll('.cell')
  cells.forEach((c,i)=>{
    c.innerText = board[i]||''
    c.classList.remove('win-mark')
  })
}

function getWinLine(player){
  return winLines.find(line=>line.every(i=>board[i]===player))
}

function markWinLine(line){
  const cells = document.querySelectorAll('.cell')
  line.forEach(i=>{
    cells[i].classList.add('win-mark')
  })
}

function aiPlay(){
  const level = levelSel.value
  let best

  if(level === 'easy'){
    const empty = board.map((v,i)=>v===null?i:null).filter(v=>v!==null)
    best = {idx: empty[Math.floor(Math.random()*empty.length)]}
  }else if(level === 'mid'){
    if(Math.random() < 0.5){
      best = minimax(board, 'O')
    }else{
      const empty = board.map((v,i)=>v===null?i:null).filter(v=>v!==null)
      best = {idx: empty[Math.floor(Math.random()*empty.length)]}
    }
  }else{
    best = minimax(board, 'O')
  }

  board[best.idx] = 'O'
  render()

  const winLine = getWinLine('O')
  if(winLine){
    gameOver=true
    markWinLine(winLine)
    tipEl.innerText='🎉 AI O获胜！'
    showConfetti()
    return
  }
  if(board.every(x=>x)){
    gameOver=true
    tipEl.innerText='🤝 平局，握手言和！'
    return
  }
  turn='X'
  tipEl.innerText='轮到X'
}

function minimax(b,player){
  let res = {score:player==='O'?-999:999, idx:-1}
  for(let i=0;i<9;i++){
    if(b[i]) continue
    let nb = [...b]
    nb[i]=player
    if(checkWinWith(nb,player)){
      return {score:player==='O'?10:-10, idx:i}
    }
    if(nb.every(x=>x)){
      return {score:0, idx:i}
    }
    let op = player==='O'?'X':'O'
    let sub = minimax(nb,op)
    if(player==='O'){
      if(sub.score>res.score){
        res.score=sub.score
        res.idx=i
      }
    }else{
      if(sub.score<res.score){
        res.score=sub.score
        res.idx=i
      }
    }
  }
  return res
}
function checkWinWith(b,p){
  return winLines.some(line=>line.every(i=>b[i]===p))
}

restartBtn.onclick = init
modeSel.onchange = init
levelSel.onchange = init
init()
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-quzi"><!DOCTYPE html>

}

}

}

  border-radius:50%;
  animation: fall 3s linear forwards;
}
@keyframes fall {
  0%{transform:translateY(-10px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}
</style>
</head>
<body>
<div class="ctrl-bar">
  <label>模式：
    <select id="gameMode">
      <option value="pvp">双人同机</option>
      <option value="ai">人机对战</option>
    </select>
  </label>
  <label>AI智力：
    <select id="aiLevel">
      <option value="easy">简单</option>
      <option value="mid" selected>中等</option>
      <option value="hard">困难</option>
    </select>
  </label>
  <label>AI速度：
    <select id="aiSpeed">
      <option value="200">快</option>
      <option value="600" selected>中</option>
      <option value="1200">慢</option>
    </select>
  </label>
  <button id="restart">重开</button>
</div>
<div id="tip">憋死牛｜黑方先行，一次只能走相邻一步，不能越过棋子、中间禁区不能落子</div>
<div id="board"></div>
<div id="confetti"></div>

<script>
const boardEl = document.getElementById('board')
const tipEl = document.getElementById('tip')
const restartBtn = document.getElementById('restart')
const modeSel = document.getElementById('gameMode')
const levelSel = document.getElementById('aiLevel')
const speedSel = document.getElementById('aiSpeed')
const confettiEl = document.getElementById('confetti')

const points = [
  {x:60,y:60},
  {x:280,y:60},
  {x:60,y:280},
  {x:280,y:280},
  {x:170,y:170},
  {x:170,y:290, forbidden:true}
]
const rawLinks = [
  [0,1],
  [0,2],
  [1,3],
  [0,4],
  [1,4],
  [2,4],
  [3,4],
  [0,3],
  [1,2]
]
const neighborMap = {
  0: [1,2,4,3],
  1: [0,3,4,2],
  2: [0,4,1],
  3: [1,4,0],
  4: [0,1,2,3],
  5: []
}
const edgeMidPoints = {
  "0,3": [4],
  "3,0": [4],
  "1,2": [4],
  "2,1": [4]
}
const forbiddenNode = 5;

let state = {
  phase:'move',
  turn:'black',
  black:[0,1],
  white:[2,3],
  selected:null
}

function showConfetti(){
  const colors = ['#ff4444','#44ff44','#4444ff','#ffdd00','#ff44ff']
  for(let i=0;i<80;i++){
    const div = document.createElement('div')
    div.className = 'confetti-item'
    div.style.left = Math.random()*100 + '%'
    div.style.background = colors[Math.floor(Math.random()*colors.length)]
    div.style.animationDelay = Math.random()*0.8 + 's'
    confettiEl.appendChild(div)
    setTimeout(()=>div.remove(),3000)
  }
}

function drawLines(){
  rawLinks.forEach(([a,b])=>{
    let p1 = points[a],p2=points[b]
    let dx = p2.x - p1.x
    let dy = p2.y - p1.y
    let len = Math.hypot(dx,dy)
    let deg = Math.atan2(dy,dx)*180/Math.PI
    let div = document.createElement('div')
    div.className='line'
    div.style.left = p1.x+'px'
    div.style.top = p1.y+'px'
    div.style.width = len+'px'
    div.style.transform = `rotate(${deg}deg)`
    boardEl.appendChild(div)
  })
}
function drawPoints(){
  points.forEach((p,idx)=>{
    let div = document.createElement('div')
    div.className = 'point'
    if(p.forbidden){
      div.classList.add('forbidden')
      div.innerText = '×'
    }
    div.style.left = p.x+'px'
    div.style.top = p.y+'px'
    div.dataset.idx = idx
    if(!p.forbidden){
      div.onclick = ()=>clickPoint(idx)
    }
    boardEl.appendChild(div)
  })
}

function isEdgeBlocked(a,b,black,white){
  const key = `${a},${b}`
  const midList = edgeMidPoints[key] || []
  const allChess = new Set([...black,...white])
  for(let m of midList){
    if(allChess.has(m)) return true
  }
  return false
}

function getStepNeighbors(pos, black, white){
  const allChess = new Set([...black,...white])
  const list = []
  for(const n of neighborMap[pos]){
    if(n === forbiddenNode) continue
    if(allChess.has(n)) continue
    if(isEdgeBlocked(pos,n,black,white)) continue
    list.push(n)
  }
  return list
}

function canPlayerMove(side, black, white){
  const arr = side==='black'?black:white
  for(let p of arr){
    if(getStepNeighbors(p, black, white).length>0) return true
  }
  return false
}

function renderChess(){
  document.querySelectorAll('.chess').forEach(e=>e.remove())
  document.querySelectorAll('.point').forEach(el=>{
    el.classList.remove('selected','can-go')
  })
  if(state.selected !== null){
    document.querySelector(`.point[data-idx="${state.selected}"]`)?.classList.add('selected')
    const canGo = getStepNeighbors(state.selected, state.black, state.white)
    for(let g of canGo){
      document.querySelector(`.point[data-idx="${g}"]`)?.classList.add('can-go')
    }
  }
  state.black.forEach(i=>{
    let d = document.createElement('div')
    d.className='chess black'
    d.style.left = points[i].x+'px'
    d.style.top = points[i].y+'px'
    boardEl.appendChild(d)
  })
  state.white.forEach(i=>{
    let d = document.createElement('div')
    d.className='chess white'
    d.style.left = points[i].x+'px'
    d.style.top = points[i].y+'px'
    boardEl.appendChild(d)
  })
}

function aiRun(){
  if(state.phase === 'over') return
  const delay = Number(speedSel.value)
  const level = levelSel.value
  let allMoves = []
  for(let chess of state.white){
    let dstList = getStepNeighbors(chess, state.black, state.white)
    for(let dst of dstList){
      allMoves.push({from:chess, to:dst})
    }
  }
  if(allMoves.length === 0){
    tipEl.innerText='🎉 黑方胜利！白方无路可走'
    state.phase='over'
    showConfetti()
    return
  }
  let selectedMove
  if(level === 'easy'){
    selectedMove = allMoves[Math.floor(Math.random()*allMoves.length)]
  }else if(level === 'mid'){
    let good = []
    for(let m of allMoves){
      let nb = [...state.black]
      let nw = [...state.white]
      let idx = nw.indexOf(m.from)
      nw[idx] = m.to
      if(!canPlayerMove('black', nb, nw)){
        good.push(m)
      }
    }
    if(good.length>0) selectedMove = good[0]
    else selectedMove = allMoves[Math.floor(Math.random()*allMoves.length)]
  }else{
    let scoreList = []
    for(let m of allMoves){
      let nb = [...state.black]
      let nw = [...state.white]
      let idx = nw.indexOf(m.from)
      nw[idx] = m.to
      if(!canPlayerMove('black', nb, nw)){
        scoreList.push({move:m, score:999})
        continue
      }
      let playerMoves = []
      for(let bc of nb){
        let pdst = getStepNeighbors(bc, nb, nw)
        for(let p of pdst) playerMoves.push(p)
      }
      scoreList.push({move:m, score: -playerMoves.length})
    }
    scoreList.sort((a,b)=>b.score - a.score)
    selectedMove = scoreList[0].move
  }
  const idx = state.white.indexOf(selectedMove.from)
  state.white[idx] = selectedMove.to
  state.selected = null
  renderChess()
  state.turn='black'
  if(!canPlayerMove('black', state.black, state.white)){
    tipEl.innerText='🎉 白方胜利！黑方无路可走'
    state.phase='over'
    showConfetti()
    return
  }
  tipEl.innerText='轮到黑方，一次只能走相邻一步，不能越过棋子、中间禁区不能落子'
}

function clickPoint(idx){
  if(state.phase === 'over') return
  const mode = modeSel.value
  if(mode === 'ai' && state.turn === 'white') return
  const myChess = state.turn==='black' ? state.black : state.white

  if(state.selected === null){
    if(myChess.includes(idx)){
      state.selected = idx
      renderChess()
      tipEl.innerText='✅ 已选中棋子，绿色点位是可以走的位置'
    }else{
      tipEl.innerText='❌ 请选择你自己的棋子！'
    }
    return
  }
  if(state.selected === idx){
    state.selected = null
    renderChess()
    tipEl.innerText='已取消选中'
    return
  }
  const neighbors = getStepNeighbors(state.selected, state.black, state.white)
  if(!neighbors.includes(idx)){
    tipEl.innerText='❌ 不能走！要么不相邻，要么中间有棋子挡住！'
    state.selected = null
    renderChess()
    return
  }
  const arr = state.turn==='black' ? state.black : state.white
  const pos = arr.indexOf(state.selected)
  arr[pos] = idx
  state.selected = null
  renderChess()
  const enemy = state.turn==='black' ? 'white' : 'black'
  if(!canPlayerMove(enemy, state.black, state.white)){
    tipEl.innerText=`🎉 ${state.turn==='black'?'黑方':'白方'}胜利！对方无路可走`
    state.phase='over'
    showConfetti()
    return
  }
  if(mode === 'pvp'){
    state.turn = enemy
    tipEl.innerText=`轮到${state.turn==='black'?'黑方':'白方'}，一次只能走相邻一步`
  }else{
    state.turn='white'
    tipEl.innerText='AI思考中...'
    setTimeout(aiRun, Number(speedSel.value))
  }
}

function resetGame(){
  boardEl.innerHTML=''
  state = {
    phase:'move',
    turn:'black',
    black:[0,1],
    white:[2,3],
    selected:null
  }
  const mode = modeSel.value
  tipEl.innerText = mode==='pvp' ? '憋死牛｜黑方先行，一次只能走相邻一步，不能越过棋子、中间禁区不能落子' : '憋死牛｜人机模式｜你是黑方，先行，一次一步'
  drawLines()
  drawPoints()
  renderChess()
}
restartBtn.onclick = resetGame
modeSel.onchange = resetGame
resetGame()
<\/script>
</body>
</html>
</script>

<style>

<body>
<div class="ctrl-bar">
  <label>模式：
    <select id="gameMode">
      <option value="pvp">双人对战</option>
      <option value="ai" selected>人机对战(红方你)</option>
    </select>
  </label>
  <label>AI难度：
    <select id="aiLevel">
      <option value="easy">简单</option>
      <option value="mid" selected>中等</option>
      <option value="hard">困难</option>
    </select>
  </label>
  <button id="restart">重开</button>
  <button id="undo">悔棋</button>
</div>
<div id="tip">红方先行</div>
<div id="board">
  <div class="river">楚河汉界</div>
</div>

<script>
const boardEl = document.getElementById('board')
const tipEl = document.getElementById('tip')
const restartBtn = document.getElementById('restart')
const undoBtn = document.getElementById('undo')
const gameModeSel = document.getElementById('gameMode')
const aiLevelSel = document.getElementById('aiLevel')

const sizeX = 9
const sizeY = 10
const gap = 36
const offsetX = 26
const offsetY = 23

const chessMap = {
  'rk':'车','nk':'马','bk':'炮','ak':'帅','sk':'士','xk':'相','zk':'兵',
  'r':'车','n':'马','b':'炮','a':'将','s':'士','x':'象','z':'卒'
}
const valueMap = {
  a:10000, r:900, n:400, b:450, s:200, x:200, z:100,
  ak:10000, rk:900, nk:400, bk:450, sk:200, xk:200, zk:100
}
let initData = [
  ['r','n','x','s','a','s','x','n','r'],
  ['','','','','','','','',''],
  ['','b','','','','','','b',''],
  ['z','','z','','z','','z','','z'],
  ['','','','','','','','',''],
  ['','','','','','','','',''],
  ['zk','','zk','','zk','','zk','','zk'],
  ['','bk','','','','','','bk',''],
  ['','','','','','','','',''],
  ['rk','nk','xk','sk','ak','sk','xk','nk','rk']
]
let board = []
let select = null
let turn = 1
let gameOver = false
let aiThinking = false
let history = []

function saveHistory(){
  history.push({
    board:JSON.parse(JSON.stringify(board)),
    turn:turn,
    select:select
  })
}
function undo(){
  if(history.length === 0 || gameOver) return
  const last = history.pop()
  board = last.board
  turn = last.turn
  select = last.select
  gameOver = false
  aiThinking = false
  tipEl.innerText = turn===1 ? "红方走棋" : "黑方走棋"
  render()
}

function init(){
  gameOver=false
  aiThinking=false
  select=null
  turn=1
  history=[]
  board = JSON.parse(JSON.stringify(initData))
  render()
  tipEl.innerText = "红方先行"
}

function render(){
  boardEl.innerHTML = `<div class="river">楚河汉界</div>`

  for(let y=0;y<10;y++){
    const h = document.createElement('div')
    h.className='line'
    h.style.width = (gap*8)+'px'
    h.style.height='1px'
    h.style.left = offsetX+'px'
    h.style.top = (offsetY + y*gap)+'px'
    boardEl.appendChild(h)
  }

  for(let x=0;x<9;x++){
    const vTop = document.createElement('div')
    vTop.className='line'
    vTop.style.width='1px'
    vTop.style.height = (gap*4)+'px'
    vTop.style.left = (offsetX + x*gap)+'px'
    vTop.style.top = offsetY+'px'
    boardEl.appendChild(vTop)

    const vBot = document.createElement('div')
    vBot.className='line'
    vBot.style.width='1px'
    vBot.style.height = (gap*4)+'px'
    vBot.style.left = (offsetX + x*gap)+'px'
    vBot.style.top = (offsetY + 5*gap)+'px'
    boardEl.appendChild(vBot)
  }

  drawLine(3,0,5,2)
  drawLine(5,0,3,2)
  drawLine(3,7,5,9)
  drawLine(5,7,3,9)

  for(let y=0;y<10;y++){
    for(let x=0;x<9;x++){
      const dot = document.createElement('div')
      dot.className='dot'
      dot.style.left = (offsetX + x*gap)+'px'
      dot.style.top = (offsetY + y*gap)+'px'
      dot.dataset.x = x
      dot.dataset.y = y
      dot.onclick = ()=>clickCell(x,y)
      boardEl.appendChild(dot)
    }
  }

  for(let y=0;y<10;y++){
    for(let x=0;x<9;x++){
      let c = board[y][x]
      if(!c) continue
      let el = document.createElement('div')
      el.className='cell'
      el.style.left = (offsetX + x*gap)+'px'
      el.style.top = (offsetY + y*gap)+'px'
      el.innerText = chessMap[c]
      if(c[1]==='k'){
        el.classList.add('red')
      }
      if(select && select[0]===x && select[1]===y){
        el.classList.add('choose')
      }
      el.dataset.x = x
      el.dataset.y = y
      el.onclick = (e)=>{
        e.stopPropagation()
        clickCell(x,y)
      }
      boardEl.appendChild(el)
    }
  }
}

function drawLine(x1,y1,x2,y2){
  const line = document.createElement('div')
  line.className='line'
  const sx = offsetX + x1*gap
  const sy = offsetY + y1*gap
  const ex = offsetX + x2*gap
  const ey = offsetY + y2*gap
  const dx = ex-sx
  const dy = ey-sy
  const len = Math.sqrt(dx*dx+dy*dy)
  const ang = Math.atan2(dy,dx)*180/Math.PI
  line.style.left = sx+'px'
  line.style.top = sy+'px'
  line.style.width = len+'px'
  line.style.height = '1px'
  line.style.transformOrigin = 'left center'
  line.style.transform = `rotate(${ang}deg)`
  boardEl.appendChild(line)
}

function clickCell(x,y){
  if(gameOver || aiThinking) return
  const mode = gameModeSel.value
  if(mode==='ai' && turn===-1) return

  let c = board[y][x]
  if(!select){
    if(!c) return
    let isRed = c[1]==='k'
    if(turn===1 && !isRed) return
    if(turn===-1 && isRed) return
    select = [x,y]
    render()
    return
  }
  let [sx,sy] = select
  if(sx===x && sy===y){
    select=null
    render()
    return
  }
  let tar = board[y][x]
  let srcChess = board[sy][sx]
  let srcRed = srcChess[1]==='k'
  let tarRed = tar && tar[1]==='k'
  if(tar && srcRed === tarRed){
    select=[x,y]
    render()
    return
  }
  if(!checkMove(sx,sy,x,y)){
    select=null
    render()
    return
  }
  saveHistory()
  move(sx,sy,x,y)
}

function move(sx,sy,tx,ty){
  const tar = board[ty][tx]
  board[ty][tx] = board[sy][sx]
  board[sy][sx] = ''
  select=null
  // ========== 修复胜负判定！==========
  if(tar){
    if(tar === 'a'){ // 吃掉黑将 a → 红胜 ✅
      gameOver=true
      tipEl.innerText = "🎉 红方胜利！"
      render()
      return
    }
    if(tar === 'ak'){ // 吃掉红帅 ak → 黑胜 ✅（之前这里逻辑虽然写对，但AI没有优先防守，并且渲染时序问题）
      gameOver=true
      tipEl.innerText = "🎉 黑方胜利！"
      render()
      return
    }
  }
  turn = -turn
  const mode = gameModeSel.value
  if(mode==='ai' && turn===-1){
    tipEl.innerText="AI思考中..."
    aiThinking=true
    render()
    setTimeout(aiGo, 350)
  }else{
    tipEl.innerText = turn===1 ? "红方走棋" : "黑方走棋"
    render()
  }
}

function checkMove(sx,sy,tx,ty){
  let c = board[sy][sx]
  let name = c[0]
  let dx = tx-sx
  let dy = ty-sy
  let absDx = Math.abs(dx)
  let absDy = Math.abs(dy)
  let tar = board[ty][tx]

  if(name==='r'){
    if(dx!==0 && dy!==0) return false
    return noBlock(sx,sy,tx,ty)
  }
  if(name==='n'){
    if(!((absDx===2 && absDy===1)||(absDx===1 && absDy===2))) return false
    let mx,my
    if(absDx===2){mx = sx + dx/2; my = sy}
    else{my = sy + dy/2; mx = sx}
    return board[my][mx]===''
  }
  if(name==='b'){
    if(dx!==0 && dy!==0) return false
    let cnt = countBlock(sx,sy,tx,ty)
    return tar ? cnt===1 : cnt===0
  }
  if(name==='s'){
    if(absDx!==1 || absDy!==1) return false
    if(c==='s'){
      if(ty<0||ty>2||tx<3||tx>5) return false
    }else{
      if(ty<7||ty>9||tx<3||tx>5) return false
    }
    return true
  }
  if(name==='a'){
    if(!((absDx===1 && absDy===0)||(absDx===0 && absDy===1))) return false
    if(c==='a'){
      if(ty<0||ty>2||tx<3||tx>5) return false
    }else{
      if(ty<7||ty>9||tx<3||tx>5) return false
    }
    if(dx===0 && absDy>1){
      if(countBlock(sx,sy,tx,ty)===0) return false
    }
    return true
  }
  if(name==='x'){
    if(absDx!==2 || absDy!==2) return false
    let mx = sx+dx/2
    let my = sy+dy/2
    if(board[my][mx]!=='') return false
    if(c==='x'){
      if(ty>4) return false
    }else{
      if(ty<5) return false
    }
    return true
  }
  if(name==='z'){
    if(c==='z'){
      if(sy<=4){
        if(dy!==1 || dx!==0) return false
      }else{
        if(!((dy===1 && dx===0)||(absDx===1 && dy===0))) return false
      }
    }else{
      if(sy>=5){
        if(dy!==-1 || dx!==0) return false
      }else{
        if(!((dy===-1 && dx===0)||(absDx===1 && dy===0))) return false
      }
    }
    return true
  }
  return false
}
function countBlock(sx,sy,tx,ty){
  let cnt=0
  if(sx===tx){
    let st = Math.min(sy,ty)+1
    let ed = Math.max(sy,ty)
    for(let y=st;y<ed;y++){
      if(board[y][sx]) cnt++
    }
  }else{
    let st = Math.min(sx,tx)+1
    let ed = Math.max(sx,tx)
    for(let x=st;x<ed;x++){
      if(board[sy][x]) cnt++
    }
  }
  return cnt
}
function noBlock(sx,sy,tx,ty){
  return countBlock(sx,sy,tx,ty)===0
}

function getAllMoves(side){
  const moves = []
  for(let y=0;y<10;y++){
    for(let x=0;x<9;x++){
      let c = board[y][x]
      if(!c) continue
      let isRed = c[1]==='k'
      if(side===1 && !isRed) continue
      if(side===-1 && isRed) continue
      for(let ty=0;ty<10;ty++){
        for(let tx=0;tx<9;tx++){
          let tar = board[ty][tx]
          let tarRed = tar && tar[1]==='k'
          if(tar && isRed === tarRed) continue
          if(checkMove(x,y,tx,ty)){
            moves.push({sx:x,sy:y,tx:tx,ty:ty})
          }
        }
      }
    }
  }
  return moves
}
function evalBoard(){
  let score = 0
  for(let y=0;y<10;y++){
    for(let x=0;x<9;x++){
      let c = board[y][x]
      if(!c) continue
      let v = valueMap[c[0]]
      if(c[1]==='k') score -= v
      else score += v
    }
  }
  return score
}
function aiGo(){
  const level = aiLevelSel.value
  const moves = getAllMoves(-1)
  if(moves.length===0){
    gameOver=true
    tipEl.innerText="🎉 红方胜利！"
    aiThinking=false
    render()
    return
  }
  let best = moves[0]
  if(level==='easy'){
    best = moves[Math.floor(Math.random()*moves.length)]
  }else{
    let maxScore = -999999
    for(let m of moves){
      let oldSrc = board[m.sy][m.sx]
      let oldTar = board[m.ty][m.tx]
      board[m.ty][m.tx] = oldSrc
      board[m.sy][m.sx] = ''
      let s = evalBoard()
      // AI优先吃帅(ak)，权重拉高
      if(oldTar && oldTar === 'ak') s += 12000
      if(oldTar && oldTar === 'a') s -= 12000
      if(s>maxScore){
        maxScore = s
        best = m
      }
      board[m.sy][m.sx] = oldSrc
      board[m.ty][m.tx] = oldTar
    }
  }
  aiThinking = false
  move(best.sx,best.sy,best.tx,best.ty)
}

restartBtn.onclick = init
undoBtn.onclick = undo
gameModeSel.onchange = init
aiLevelSel.onchange = init
init()
<\/script>
</body>

</script>

<script>
(function(){
  var GAMES = [
    { id:'gomoku',    name:'五子棋',   icon:'⚫',  desc:'五子连珠即胜', c:'#5eead4' },
    { id:'tictactoe', name:'井字棋',   icon:'⭕',  desc:'三子连线即胜', c:'#fbbf24' },
    { id:'quzi',      name:'憋死牛',   icon:'🐂',  desc:'把对方憋死',   c:'#60a5fa' },
    { id:'xiangqi',   name:'中国象棋', icon:'🀄', desc:'楚河汉界对弈', c:'#f472b6' }
  ];

  var grid    = document.getElementById('grid');
  var home    = document.getElementById('home');
  var stage   = document.getElementById('stage');
  var frame   = document.getElementById('gameFrame');
  var back    = document.getElementById('back');

  var LITERAL = '<' + '\\' + '/script>';
  var TAG     = '</' + 'script>';

  function sourceOf(id){
    var el = document.getElementById('src-' + id);
    return el.textContent.split(LITERAL).join(TAG);
  }

  function openGame(g){
    frame.srcdoc = sourceOf(g.id);
    stage.classList.add('is-shown');
    home.classList.add('is-hidden');
    document.title = g.name + ' · 游戏大厅';
  }

  function goHome(){
    if(!stage.classList.contains('is-shown')) return;
    stage.classList.remove('is-shown');
    home.classList.remove('is-hidden');
    frame.srcdoc = '';
    document.title = '游戏大厅';
  }

  GAMES.forEach(function(g, i){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';
    btn.style.setProperty('--c', g.c);
    btn.style.animationDelay = (i * 70) + 'ms';
    btn.setAttribute('aria-label', g.name + '：' + g.desc);

    var ico = document.createElement('span');
    ico.className = 'ico';
    ico.textContent = g.icon;

    var nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = g.name;

    var ds = document.createElement('span');
    ds.className = 'ds';
    ds.textContent = g.desc;

    btn.appendChild(ico);
    btn.appendChild(nm);
    btn.appendChild(ds);
    btn.addEventListener('click', function(){ openGame(g); });
    grid.appendChild(btn);
  });

  for(var i = GAMES.length; i < 9; i++){
    var d = document.createElement('div');
    d.className = 'tile empty';
    d.style.animationDelay = (i * 70) + 'ms';
    d.setAttribute('aria-hidden', 'true');

    var plus = document.createElement('span');
    plus.className = 'plus';
    plus.textContent = '＋';

    var tag = document.createElement('span');
    tag.className = 'ds';
    tag.textContent = '敬请期待';

    d.appendChild(plus);
    d.appendChild(tag);
    grid.appendChild(d);
  }

  back.addEventListener('click', goHome);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') goHome();
  });
})();
</script>
